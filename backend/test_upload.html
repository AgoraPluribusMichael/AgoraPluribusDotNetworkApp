<!DOCTYPE html>
<html>
<head>
    <title>Test File Upload</title>
</head>
<body>
    <h1>Test Editor.js File Upload</h1>

    <form id="uploadForm">
        <label for="siteId">Site ID:</label>
        <input type="text" id="siteId" value="test-site" required><br><br>

        <label for="fileInput">Select Image:</label>
        <input type="file" id="fileInput" accept="image/*" required><br><br>

        <button type="submit">Upload File</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const siteId = document.getElementById('siteId').value;
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file) {
                alert('Please select a file');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`http://127.0.0.1:8000/api/v1/sites/${siteId}/uploadFile`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                document.getElementById('result').innerHTML =
                    '<h3>Result:</h3><pre>' + JSON.stringify(result, null, 2) + '</pre>';

                if (result.success) {
                    document.getElementById('result').innerHTML +=
                        `<h3>Uploaded Image:</h3><img src="${result.file.url}" style="max-width: 300px;" alt="Uploaded image">`;
                }
            } catch (error) {
                document.getElementById('result').innerHTML =
                    '<h3>Error:</h3><pre>' + error.message + '</pre>';
            }
        });
    </script>
</body>
</html>
